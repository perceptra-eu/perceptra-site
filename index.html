<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perceptra — Market Intelligence</title>
<meta name="description" id="meta-desc" content="Perceptra simula focus group con audience sintetiche calibrate su panel umani reali. Ogni insight è misurato con lo SHCS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1D2D;
  --panel:#102A40;
  --panel-2:#0E2436;
  --teal:#299DA8;
  --cyan:#32C7DD;
  --paper:#F2F5F7;
  --muted:#8CA3B5;
  --line:rgba(140,163,181,.16);
  --maxw:1140px;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:'Instrument Sans',system-ui,sans-serif;
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--cyan);color:var(--ink)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ---------- type ---------- */
h1,h2,h3{font-family:'Archivo',sans-serif;line-height:1.08;letter-spacing:-.02em}
h1{font-size:clamp(2.4rem,5.4vw,4.2rem);font-weight:800}
h2{font-size:clamp(1.8rem,3.6vw,2.7rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--teal);
  display:flex;align-items:center;gap:.8rem;
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--teal);flex:none}
.lead{color:var(--muted);font-size:1.08rem;max-width:56ch}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- layout primitives ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
section{padding:104px 0;border-top:1px solid var(--line)}
.sec-head{display:grid;gap:1.1rem;margin-bottom:3.2rem;max-width:720px}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}

/* ---------- nav ---------- */
nav{
  position:sticky;top:0;z-index:50;
  background:rgba(11,29,45,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem}
.brand-logo{height:38px;width:auto}
.brand-logo--full{height:62px}
.nav-links{display:flex;gap:2rem;align-items:center}
.nav-links a{font-size:.92rem;color:var(--muted);transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--paper)}
.btn{
  display:inline-flex;align-items:center;gap:.55rem;
  font-family:'Archivo',sans-serif;font-weight:600;font-size:.95rem;
  padding:.78rem 1.5rem;border-radius:999px;cursor:pointer;border:0;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:focus-visible,a:focus-visible,.lang button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn-primary{background:linear-gradient(120deg,var(--cyan),var(--teal));color:var(--ink)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(50,199,221,.25)}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid rgba(140,163,181,.35)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.nav-cta{padding:.6rem 1.2rem;font-size:.88rem}

/* ---------- lang switcher ---------- */
.lang{
  display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;
  padding:3px;background:rgba(16,42,64,.6);
}
.lang button{
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;
  background:transparent;border:0;color:var(--muted);cursor:pointer;
  padding:.32rem .62rem;border-radius:999px;transition:background .2s,color .2s;
}
.lang button:hover{color:var(--paper)}
.lang button.active{background:linear-gradient(120deg,var(--cyan),var(--teal));color:var(--ink);font-weight:500}

/* ---------- hero ---------- */
.hero{border-top:0;padding:96px 0 110px;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;inset:auto -20% -55% -20%;height:70%;
  background:radial-gradient(ellipse at center,rgba(41,157,168,.13),transparent 65%);
  pointer-events:none;
}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:4.5rem;align-items:center;position:relative;z-index:1}
.hero h1 .hl{background:linear-gradient(100deg,var(--cyan),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{margin:1.4rem 0 2.2rem}
.hero-ctas{display:flex;gap:1rem;flex-wrap:wrap}
.hero-note{margin-top:1.6rem;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.hero-note b{color:var(--teal);font-weight:500}

/* console card (signature) */
.console{
  background:linear-gradient(160deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  overflow:hidden;
}
.console-bar{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.2rem;border-bottom:1px solid var(--line)}
.console-bar .t{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.live{display:flex;align-items:center;gap:.45rem;font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--cyan);letter-spacing:.1em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.console-q{padding:1.1rem 1.2rem .2rem;font-size:.92rem;color:var(--paper)}
.console-q span{color:var(--muted)}

/* triangulation: three independent estimates converge on one range */
.tri{padding:.9rem 1.2rem 1.2rem}
.tri-row{display:grid;grid-template-columns:10.5rem 1fr;gap:1rem;align-items:center;padding:.5rem 0}
.tri-l{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.04em;color:var(--muted);line-height:1.35}
.tri-l b{display:block;color:var(--paper);font-weight:500;font-size:.68rem;letter-spacing:.06em}
.tri-track{position:relative;height:10px;border-radius:999px;background:rgba(140,163,181,.12)}
.tri-bar{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--teal),rgba(50,199,221,.75));transform-origin:left center;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.tri-row.final{margin-top:.35rem;padding-top:.9rem;border-top:1px dashed var(--line)}
.tri-row.final .tri-l b{color:var(--cyan)}
.tri-row.final .tri-track{background:rgba(50,199,221,.08)}
.tri-row.final .tri-bar{background:var(--cyan);box-shadow:0 0 14px rgba(50,199,221,.55)}
.tri-mark{position:absolute;top:-6px;bottom:-6px;width:2px;border-radius:2px;background:var(--paper);opacity:0;transition:opacity .4s}
.tri-axis{display:grid;grid-template-columns:10.5rem 1fr;gap:1rem;margin-top:.35rem;font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.06em;color:var(--muted)}
.tri-axis .ticks{display:flex;justify-content:space-between}
.tri.go .tri-bar{transform:scaleX(1)}
.tri.go .tri-mark{opacity:1;transition-delay:2.5s}
.console-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.cstat{padding:1rem 1.2rem;border-right:1px solid var(--line)}
.cstat:last-child{border-right:0}
.cstat .v{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s}
.cstat .v em{font-style:normal;color:var(--cyan)}
.console.done .cstat .v{opacity:1;transform:none}
.cstat .l{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:.15rem}

/* ---------- problema ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}
.prose p{color:var(--muted);margin-bottom:1.1rem}
.prose p b,.prose p strong{color:var(--paper);font-weight:600}
.claimbox{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.6rem 1.8rem;margin-top:.4rem;
}
.claimbox .mono{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.claimbox p{font-family:'Archivo',sans-serif;font-weight:600;font-size:1.25rem;line-height:1.35;margin-top:.6rem;color:var(--paper)}

/* ---------- servizi ---------- */
.pillars{display:grid;grid-template-columns:1.15fr .85fr;gap:1.1rem;align-items:stretch}
.pillar{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:2.2rem}
.pillar.main{background:linear-gradient(160deg,var(--panel),var(--panel-2));border-color:rgba(50,199,221,.35)}
.pillar .mono{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.pillar h3{font-size:1.5rem;margin:.9rem 0 .7rem;line-height:1.25}
.pillar p{color:var(--muted);font-size:.98rem}
.pillar ul{list-style:none;margin-top:1.3rem;display:grid;gap:.6rem}
.pillar li{position:relative;padding-left:1.4rem;font-size:.95rem;color:var(--paper)}
.pillar li::before{content:"";position:absolute;left:0;top:.72em;width:.65rem;height:2px;background:var(--cyan)}
.pillar:not(.main) li::before{background:var(--teal)}

/* ---------- metodo ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
.step{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.6rem 1.4rem;position:relative;
}
.step .n{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--teal);letter-spacing:.16em}
.step h3{margin:.8rem 0 .55rem}
.step p{font-size:.92rem;color:var(--muted)}
.step::after{
  content:"→";position:absolute;right:-17px;top:50%;transform:translateY(-50%);
  color:var(--teal);font-size:1.1rem;z-index:2;
}
.step:last-child::after{display:none}

/* ---------- affidabilita ---------- */
.rel-card{
  background:linear-gradient(160deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:2.2rem;display:grid;grid-template-columns:1.2fr .8fr;gap:2.5rem;align-items:center;
}
.chain{list-style:none;display:grid;gap:.75rem}
.chain li{
  display:grid;grid-template-columns:6.2rem 1fr;gap:1rem;align-items:center;position:relative;
  padding:.8rem 1rem;border:1px solid var(--line);border-radius:10px;background:rgba(11,29,45,.55);
}
.chain li+li::before{content:"";position:absolute;left:3rem;top:calc(-.75rem - 1px);height:.75rem;border-left:1px dashed var(--teal)}
.chain .k{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.chain .t{font-size:.92rem;color:var(--paper);line-height:1.35}
.chain .t span{display:block;color:var(--muted);font-size:.8rem}
.chain li:first-child{border-color:rgba(50,199,221,.4)}
.score .v{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(3.4rem,6vw,5rem);letter-spacing:-.01em;line-height:1;background:linear-gradient(100deg,var(--cyan),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.score .l{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.6rem}
.score p{color:var(--muted);font-size:.95rem;margin-top:1.2rem;max-width:34ch}
.threshold{
  margin-top:1.4rem;padding:.8rem 1rem;border-left:2px solid var(--cyan);
  background:rgba(50,199,221,.06);font-size:.78rem;color:var(--paper);border-radius:0 8px 8px 0;
  font-family:'IBM Plex Mono',monospace;
}

/* ---------- vision/mission ---------- */
.vm{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.vm-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:2.2rem}
.vm-card .mono{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.vm-card h3{font-size:1.5rem;margin:.9rem 0 .7rem;line-height:1.25}
.vm-card p{color:var(--muted);font-size:.98rem}

.values{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem;margin-top:1.1rem}
.value{border:1px solid var(--line);border-radius:var(--radius);padding:1.7rem 1.6rem;background:var(--panel-2)}
.value h3{display:flex;align-items:baseline;gap:.7rem}
.value h3 .k{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--teal);letter-spacing:.12em;font-weight:500}
.value p{font-size:.92rem;color:var(--muted);margin-top:.5rem}

/* ---------- team ---------- */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
.member{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.7rem 1.5rem;transition:border-color .25s,transform .25s}
.member:hover{border-color:rgba(50,199,221,.4);transform:translateY(-3px)}
.avatar{
  width:52px;height:52px;border-radius:12px;margin-bottom:1.1rem;
  background:linear-gradient(135deg,var(--teal),var(--panel));
  display:flex;align-items:center;justify-content:center;
  font-family:'Archivo',sans-serif;font-weight:800;color:var(--ink);font-size:1.05rem;letter-spacing:-.02em;
}
.member h3{font-size:1.02rem}
.member .role{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:.3rem 0 .7rem}
.member p{font-size:.86rem;color:var(--muted)}

/* ---------- positioning strip ---------- */
.strip{
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(120deg,rgba(41,157,168,.1),rgba(16,42,64,.6));
  padding:2.4rem 2.6rem;display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;
}
.strip h3{font-size:1.45rem;max-width:30ch}
.strip p{color:var(--muted);margin-top:.5rem;max-width:56ch;font-size:.96rem}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:64px 0 40px}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:3rem;margin-bottom:3rem}
.f-grid p{color:var(--muted);font-size:.9rem;max-width:38ch;margin-top:.9rem}
.f-col h4{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:1rem;font-weight:500}
.f-col a{display:block;color:var(--muted);font-size:.92rem;padding:.28rem 0;transition:color .2s}
.f-col a:hover{color:var(--paper)}
.f-bottom{border-top:1px solid var(--line);padding-top:1.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.08em}

/* ---------- responsive ---------- */
@media(max-width:960px){
  .hero-grid,.split,.rel-card,.pillars{grid-template-columns:1fr;gap:2.6rem}
  .steps{grid-template-columns:1fr 1fr}
  .step::after{display:none}
  .team{grid-template-columns:1fr 1fr}
  .strip{grid-template-columns:1fr}
  .f-grid{grid-template-columns:1fr}
  .nav-links a:not(.btn){display:none}
  section{padding:78px 0}
}
@media(max-width:560px){
  .steps,.team,.vm,.values{grid-template-columns:1fr}
  .tri-row,.tri-axis{grid-template-columns:1fr;gap:.4rem}
  .tri-axis>span:first-child{display:none}
  .chain li{grid-template-columns:1fr;gap:.2rem}
  .chain li+li::before{left:1.4rem}
  .rel-card,.pillar{padding:1.6rem}
  .console-stats{grid-template-columns:1fr 1fr 1fr}
  .cstat{padding:.85rem .8rem}
  .cstat .v{font-size:1.15rem}
  .nav-cta{display:none}
}
</style>
</head>
<body>

<!-- ============ NAV ============ -->
<nav>
  <div class="nav-in">
    <a class="brand" href="#top" aria-label="Perceptra — home">
      <img class="brand-logo" src="/brand/perceptra-wordmark-on-dark.svg" alt="Perceptra" width="148" height="38">
    </a>
    <div class="nav-links">
      <a href="#servizi" data-i18n="n_servizi"></a>
      <a href="#metodo" data-i18n="n_metodo"></a>
      <a href="#affidabilita" data-i18n="n_aff"></a>
      <a href="#chi-siamo" data-i18n="n_chi"></a>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="it">IT</button>
        <button data-lang="en">EN</button>
        <button data-lang="fr">FR</button>
      </div>
      <a href="#contatti" class="btn btn-primary nav-cta" data-i18n="n_cta"></a>
    </div>
  </div>
</nav>

<!-- ============ HERO ============ -->
<header class="hero" id="top">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" data-i18n="h_eyebrow"></div>
      <h1 style="margin-top:1.2rem" data-i18n="h_title"></h1>
      <p class="lead" data-i18n="h_lead"></p>
      <div class="hero-ctas">
        <a href="#contatti" class="btn btn-primary" data-i18n="h_cta1"></a>
        <a href="#metodo" class="btn btn-ghost" data-i18n="h_cta2"></a>
      </div>
      <p class="hero-note" data-i18n="h_note"></p>
    </div>

    <!-- signature: triangulation console (illustrative example) -->
    <div class="console" id="console">
      <div class="console-bar">
        <span class="t" data-i18n="c_title"></span>
        <span class="live"><i></i><span data-i18n="c_live"></span></span>
      </div>
      <div class="console-q" data-i18n="c_q"></div>
      <div class="tri" id="tri" aria-hidden="true">
        <div class="tri-row"><span class="tri-l" data-i18n="c_m1"></span><div class="tri-track"><i class="tri-bar" style="left:40.0%;width:35.0%;transition-delay:0.2s"></i></div></div>
        <div class="tri-row"><span class="tri-l" data-i18n="c_m2"></span><div class="tri-track"><i class="tri-bar" style="left:32.5%;width:32.5%;transition-delay:0.6s"></i></div></div>
        <div class="tri-row"><span class="tri-l" data-i18n="c_m3"></span><div class="tri-track"><i class="tri-bar" style="left:47.5%;width:37.5%;transition-delay:1s"></i></div></div>
        <div class="tri-row final"><span class="tri-l" data-i18n="c_m4"></span><div class="tri-track"><i class="tri-bar" style="left:47.5%;width:17.5%;transition-delay:1.7s"></i><i class="tri-mark" style="left:56.0%"></i></div></div>
        <div class="tri-axis"><span data-i18n="c_axis"></span><div class="ticks"><span>300</span><span>400</span><span>500</span></div></div>
      </div>
      <div class="console-stats">
        <div class="cstat"><div class="v" data-i18n="c_v1"></div><div class="l" data-i18n="c_val"></div></div>
        <div class="cstat"><div class="v" data-i18n="c_v2"></div><div class="l" data-i18n="c_rng"></div></div>
        <div class="cstat"><div class="v"><em>AB</em></div><div class="l" data-i18n="c_rat"></div></div>
      </div>
    </div>
  </div>
</header>

<!-- ============ IL PROBLEMA ============ -->
<section id="problema">
  <div class="wrap">
    <div class="sec-head rv">
      <div class="eyebrow" data-i18n="p_eyebrow"></div>
      <h2 data-i18n="p_title"></h2>
    </div>
    <div class="split">
      <div class="prose rv">
        <p data-i18n="p_p1"></p>
        <p data-i18n="p_p2"></p>
        <p data-i18n="p_p3"></p>
      </div>
      <div class="rv">
        <div class="claimbox">
          <span class="mono" data-i18n="p_c1_k"></span>
          <p data-i18n="p_c1_t"></p>
        </div>
        <div class="claimbox" style="margin-top:1.1rem">
          <span class="mono" data-i18n="p_c2_k"></span>
          <p data-i18n="p_c2_t"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ SERVIZI ============ -->
<section id="servizi">
  <div class="wrap">
    <div class="sec-head rv">
      <div class="eyebrow" data-i18n="sv_eyebrow"></div>
      <h2 data-i18n="sv_title"></h2>
      <p class="lead" data-i18n="sv_lead"></p>
    </div>
    <div class="pillars rv">
      <div class="pillar main">
        <span class="mono" data-i18n="sv1_k"></span>

function setLang(l){
  const d = I18N[l] || I18N.en;
  document.documentElement.lang = l;
  document.title = d._title;
  const md=document.getElementById('meta-desc'); if(md) md.setAttribute('content', d._desc);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(d[k]!==undefined) el.innerHTML=d[k];
  });
  document.querySelectorAll('.lang button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===l);
    b.setAttribute('aria-pressed', b.dataset.lang===l ? 'true':'false');
  });
}

/* Auto-detect from device/browser language: it→IT, fr→FR, else EN */
(function(){
  const pref=(navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  const p=pref.toLowerCase();
  const l = p.startsWith('it') ? 'it' : p.startsWith('fr') ? 'fr' : 'en';
  setLang(l);
  document.querySelectorAll('.lang button').forEach(b=>{
    b.addEventListener('click',()=>setLang(b.dataset.lang));
  });
})();

/* ================= INTERACTIONS ================= */
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* scroll reveal */
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  },{threshold:.15});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));

  /* hero: three independent estimates converge, then the result appears */
  const con = document.getElementById('console');
  const tri = document.getElementById('tri');
  function runTri(){
    if(reduce){ tri.classList.add('go'); con.classList.add('done'); return; }
    tri.classList.remove('go'); con.classList.remove('done');
    void tri.offsetWidth;
    tri.classList.add('go');
    setTimeout(()=>con.classList.add('done'), 2900);
    setTimeout(runTri, 11000);
  }
  runTri();
})();
</script>
